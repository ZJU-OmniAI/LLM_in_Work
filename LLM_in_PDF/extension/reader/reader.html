<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM_in_PDF · PDF 阅读器</title>
  <link rel="stylesheet" href="../vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="../content/content.css">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header id="reader-toolbar">
    <strong>LLM_in_PDF <small>PDF</small></strong>
    <a id="choose-document" href="reader.html" title="打开其他在线或本地 PDF">打开文件</a>
    <div class="reader-controls">
      <button id="previous" title="上一页">←</button>
      <label><input id="page-number" type="number" value="1" min="1" aria-label="页码"> / <span id="page-count">—</span></label>
      <button id="next" title="下一页">→</button>
      <select id="zoom" aria-label="缩放">
        <option value="page-width">适合宽度</option>
        <option value="page-fit">整页</option>
        <option value="0.75">75%</option><option value="1">100%</option>
        <option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option>
      </select>
      <input id="find" type="search" placeholder="查找正文…" aria-label="查找正文">
      <button id="select-image" disabled aria-pressed="false" title="拖框选择 PDF 图片、图表或扫描内容">框选图片</button>
    </div>
    <a id="abstract" target="_blank" rel="noopener" hidden>摘要页</a>
    <a id="original" target="_blank" rel="noopener" hidden>原生 PDF</a>
  </header>
  <div id="reader-status" role="status">正在加载 PDF…</div>
  <div id="viewer-container" tabindex="0"><div id="viewer" class="pdfViewer"></div></div>
  <section id="document-picker" hidden>
    <h1>打开论文 PDF</h1>
    <p>支持其他学术平台、学校和期刊网站的 PDF，也支持电脑上的论文。</p>
    <form id="url-form"><label for="document-url">在线 PDF 或本地文件地址</label><div class="url-row"><input id="document-url" type="url" placeholder="https://… 或 file:///…" required><button type="submit">打开链接</button></div></form>
    <label id="file-drop" for="local-file"><strong>选择本地 PDF，或将文件拖到这里</strong><span>文件保存在浏览器本地，最大 100 MB；不会上传原始 PDF。</span><input id="local-file" type="file" accept="application/pdf,.pdf"></label>
    <p class="file-help">要直接打开浏览器中的 file:// PDF，请在扩展详情开启「允许访问文件网址」。选择文件无需开启此权限。需要登录的网站请先登录；受限下载可保存到电脑后导入。</p>
    <p id="open-error" role="status"></p>
    <h2>已导入的本地论文</h2><div id="local-documents"></div>
  </section>
  <script src="../vendor/katex/katex.min.js"></script>
  <script src="../vendor/markdown-it/markdown-it.min.js"></script>
  <script src="../content/markdown.js"></script>
  <script type="module" src="reader.js"></script>
</body>
</html>
