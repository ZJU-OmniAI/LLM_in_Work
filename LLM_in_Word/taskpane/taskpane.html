<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title data-i18n="LLM_in_Word · Word 写作助手">LLM_in_Word · Word 写作助手</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <div id="app">
    <header class="hdr">
      <div class="brand-mark" aria-hidden="true">w<span>✦</span></div>
      <div class="brand-copy"><span class="hdr-title">LLM_in_Word</span><span class="brand-sub" data-i18n="让每一句，更进一步">让每一句，更进一步</span></div>
      <span class="hdr-sp"></span>
      <select id="sel-language" class="language-select" aria-label="Interface language / 界面语言" title="Interface language / 界面语言"><option value="en">English</option><option value="zh-CN">中文</option></select>
      <button id="btn-new" class="ibtn" title="新会话，当前会话自动归档" aria-label="新会话" data-i18n-title="新会话，当前会话自动归档" data-i18n-aria-label="新会话">＋</button>
      <button id="btn-hist" class="ibtn" title="会话历史" aria-label="会话历史" data-i18n-title="会话历史" data-i18n-aria-label="会话历史">◷</button>
      <button id="btn-reload" class="ibtn" title="刷新面板" aria-label="刷新面板" data-i18n-title="刷新面板" data-i18n-aria-label="刷新面板">⟳</button>
    </header>
    <div id="banner" class="banner hidden" role="status"></div>
    <section class="engine-panel" aria-label="模型设置" data-i18n-aria-label="模型设置">
      <div class="section-heading"><span class="eyebrow" data-i18n="写作引擎">写作引擎</span><button id="btn-connection" class="connection-button" title="查看连接状态与登录指引" data-i18n-title="查看连接状态与登录指引"><span id="status-dot" class="dot"></span><span id="status-text" data-i18n="正在连接">正在连接</span><span aria-hidden="true">›</span></button></div>
      <div class="cfg-row engine-row">
        <label class="field backend-field"><span data-i18n="后端">后端</span><select id="sel-backend" aria-label="后端" data-i18n-aria-label="后端"><option value="claude">Claude Code</option><option value="codex">Codex</option></select></label>
        <label class="field model-field"><span data-i18n="模型">模型</span><select id="sel-model" aria-label="模型" data-i18n-aria-label="模型"></select></label>
        <button id="btn-models" class="ibtn" title="刷新模型列表" aria-label="刷新模型列表" data-i18n-title="刷新模型列表" data-i18n-aria-label="刷新模型列表">⟳</button>
      </div>
      <div id="model-detail" class="model-detail" aria-live="polite"></div>
      <div class="engine-footer"><label class="effort-label" for="sel-effort" data-i18n="思考强度">思考强度</label><select id="sel-effort" aria-label="思考强度" data-i18n-aria-label="思考强度"></select><span id="engine-hint" data-i18n="使用本机订阅">使用本机订阅</span></div>
    </section>
    <div class="workspace-toolbar">
      <div class="mode-tabs" role="group" aria-label="工作模式" data-i18n-aria-label="工作模式"><button id="mode-edit" class="mode-tab active" aria-pressed="true" data-i18n="改写文稿">改写文稿</button><button id="mode-ask" class="mode-tab" aria-pressed="false" data-i18n="文档问答">文档问答</button></div>
      <label class="track-label" id="track-wrap" title="以 Word 修订写入，可在审阅中逐条接受或拒绝" data-i18n-title="以 Word 修订写入，可在审阅中逐条接受或拒绝"><input type="checkbox" id="chk-track" checked=""><span data-i18n="保留修订">保留修订</span></label>
    </div>
    <section id="target-bar" class="target empty" aria-label="改写目标" data-i18n-aria-label="改写目标">
      <div class="section-heading"><span class="eyebrow">01 <span data-i18n="选择内容">选择内容</span></span><span id="target-count" class="count-label">0 / 8</span></div>
      <div class="target-row"><button id="btn-capture" class="btn capture-btn"><span aria-hidden="true">＋</span><span data-i18n="添加 Word 选中内容"> 添加 Word 选中内容</span></button><button id="btn-clear" class="ibtn" title="清除全部目标" aria-label="清除全部目标" data-i18n-title="清除全部目标" data-i18n-aria-label="清除全部目标">×</button></div>
      <div id="sel-hint" class="sel-hint"></div><div id="target-info" class="target-info"></div><div id="target-list" class="target-list"></div>
    </section>
    <main id="messages" class="messages" aria-label="对话和改写结果" tabindex="0" data-i18n-aria-label="对话和改写结果"></main>
    <section class="composer" aria-label="输入指令" data-i18n-aria-label="输入指令">
      <div class="section-heading"><label for="input" class="eyebrow">02 <span id="instruction-label" data-i18n="告诉我怎么改">告诉我怎么改</span></label><span id="request-status" class="request-status" role="status"></span></div>
      <div id="presets" class="presets" aria-label="快捷指令" data-i18n-aria-label="快捷指令"></div>
      <div class="input-shell">
        <textarea id="input" rows="3" placeholder="比如：更简洁一些，保留关键数据…" aria-label="改写指令" data-i18n-aria-label="改写指令" data-i18n-placeholder="比如：更简洁一些，保留关键数据…"></textarea>
        <div id="att-chips" class="att-chips"></div>
        <div class="input-actions"><button id="att-local" class="ibtn attach-button" title="添加参考文件，或拖拽文件到输入区" aria-label="添加参考文件" data-i18n-title="添加参考文件，或拖拽文件到输入区" data-i18n-aria-label="添加参考文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 13 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l9-9"></path></svg><span data-i18n="参考文件">参考文件</span></button><span class="hdr-sp"></span><button id="btn-send" class="btn btn-primary"><span data-i18n="生成改写">生成改写 </span><span aria-hidden="true">↑</span></button><button id="btn-stop" class="btn btn-stop hidden" data-i18n="停止生成">停止生成</button></div>
      </div>
      <input type="file" id="file-input" multiple="" accept=".txt,.md,.csv,.pdf,.png,.jpg,.jpeg,.gif,.webp" class="hidden">
      <div class="composer-caption"><span data-i18n="Enter 发送 · Shift + Enter 换行">Enter 发送 · Shift + Enter 换行</span><span data-i18n="预览后再写入">预览后再写入</span></div>
    </section>
    <section id="hist-view" class="overlay hidden" role="dialog" aria-modal="true" aria-label="会话历史" data-i18n-aria-label="会话历史"><div class="overlay-head"><b data-i18n="会话历史">会话历史</b><span class="hdr-sp"></span><button id="hist-close" class="ibtn" aria-label="关闭会话历史" data-i18n-aria-label="关闭会话历史">×</button></div><div id="hist-list" class="overlay-body"></div></section>
    <section id="connection-view" class="overlay hidden" role="dialog" aria-modal="true" aria-label="连接设置" data-i18n-aria-label="连接设置">
      <div class="overlay-head"><b data-i18n="连接设置">连接设置</b><span class="hdr-sp"></span><button id="connection-close" class="ibtn" aria-label="关闭连接设置" data-i18n-aria-label="关闭连接设置">×</button></div>
      <div class="overlay-body"><p class="settings-intro" data-i18n="连接本机 Claude Code 和 Codex，沿用已登录的账户。">连接本机 Claude Code 和 Codex，沿用已登录的账户。</p><div id="connection-details" aria-live="polite"></div><button id="btn-diagnose" class="btn btn-primary" data-i18n="重新检测">重新检测</button><p class="settings-footnote" data-i18n="检测只检查 CLI 和登录状态，不调用模型生成。">检测只检查 CLI 和登录状态，不调用模型生成。</p></div>
    </section>
  </div>
  <script src="i18n.js"></script><script src="table-utils.js"></script><script src="taskpane.js"></script>


</body></html>
