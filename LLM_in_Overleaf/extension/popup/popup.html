<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="brand"><span>✦</span> LLM_in_Overleaf</div><p class="subtitle" data-i18n="你的论文写作助手">你的论文写作助手</p>
  <button id="open-panel" type="button"><span data-i18n="打开写作助手">打开写作助手</span> <span aria-hidden="true">↗</span></button>
  <p id="page-status" role="status" data-i18n="在 Overleaf 项目中打开，有选区时会自动读取。">在 Overleaf 项目中打开，有选区时会自动读取。</p>
  <div id="status" role="status" class="status" data-i18n="检查本机桥…">检查本机桥…</div>
  <div class="row">
    <label for="backend" data-i18n="助手">助手</label>
    <select id="backend">
      <option value="claude">Claude</option>
      <option value="codex">Codex</option>
    </select>
  </div>
  <div class="row">
    <label for="model" data-i18n="模型">模型</label>
    <select id="model"></select>
  </div>
  <div class="row">
    <label for="effort" data-i18n="思考">思考</label>
    <select id="effort"></select>
  </div>
  <div class="row">
    <label for="language" data-i18n="语言">语言</label>
    <select id="language">
      <option value="en">English</option>
      <option value="zh-CN">中文</option>
    </select>
  </div>
  <button id="refresh" type="button" data-i18n="重新检查连接">重新检查连接</button>
  <div class="tip">
    <b data-i18n="快速上手">快速上手</b>
    <p data-i18n="在 Overleaf 项目的 Code Editor 中选中一段 LaTeX，点「✦ 改这段」开始。没有浮标？点上方「打开写作助手」，再点面板里的「添加选段」。可依次添加同一文件中的多个不连续段落。快捷键 ⌘⇧E（Windows / Linux：Ctrl⇧E）。">在 Overleaf 项目的 Code Editor 中选中一段 LaTeX，点「✦ 改这段」开始。没有浮标？点上方「打开写作助手」，再点面板里的「添加选段」。可依次添加同一文件中的多个不连续段落。快捷键 ⌘⇧E（Windows / Linux：Ctrl⇧E）。</p>
    <a href="https://www.overleaf.com/project" target="_blank" rel="noopener noreferrer">overleaf.com/project ↗</a>
  </div>
  <div id="install-tip" class="install hidden">
    <span data-i18n="本机桥未安装/未就绪。在下载的 LLM_in_Work 仓库目录执行：">本机桥未安装/未就绪。在下载的 LLM_in_Work 仓库目录执行：</span><br>
    <code id="install-command">cd LLM_in_Overleaf && ./install.sh</code>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
