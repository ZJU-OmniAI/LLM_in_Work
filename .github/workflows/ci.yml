name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  word:
    name: Word (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: LLM_in_Word
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: LLM_in_Word/package-lock.json
      - run: npm ci
      - name: Validate scripts
        shell: bash
        run: |
          bash -n install.sh
          for file in server/*.js taskpane/*.js tools/*.js; do node --check "$file"; done
      - name: Run offline regression tests
        run: npm test
      - name: Windows installation, update, HTTPS and uninstall smoke test
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/test-windows-install.ps1

  powerpoint:
    name: PowerPoint (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: LLM_in_PowerPoint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: LLM_in_PowerPoint/package-lock.json
      - run: npm ci
      - name: Validate scripts and manifest
        shell: bash
        run: |
          bash -n install.sh
          for file in server/*.js taskpane/*.js tools/*.js tools/fixtures/*.js; do node --check "$file"; done
          node -e "const x=require('fs').readFileSync('manifest.xml','utf8'); if(!/<Host Name=\"Presentation\"\/>/.test(x)||!x.includes('https://localhost:8387/taskpane.html')) process.exit(1)"
      - name: Run offline regression tests
        run: npm test
      - name: Windows installation, update, HTTPS and uninstall smoke test
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/test-windows-install.ps1

  excel:
    name: Excel (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: LLM_in_Excel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: LLM_in_Excel/package-lock.json
      - run: npm ci
      - name: Validate scripts and manifest
        shell: bash
        run: |
          bash -n install.sh
          for file in server/*.js taskpane/*.js tools/*.js tools/fixtures/*.js; do node --check "$file"; done
          node -e "const x=require('fs').readFileSync('manifest.xml','utf8'); if(!/<Host Name=\"Workbook\"\/>/.test(x)||!x.includes('https://localhost:8397/taskpane.html')) process.exit(1)"
      - name: Run offline regression tests
        run: npm test
      - name: Windows installation, update, HTTPS and uninstall smoke test
        timeout-minutes: 3
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/test-windows-install.ps1

  overleaf:
    name: Overleaf (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: LLM_in_Overleaf
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: LLM_in_Overleaf/package-lock.json
      - run: npm ci
      - name: Validate scripts
        shell: bash
        run: |
          bash -n install.sh
          for file in server/*.js extension/content/*.js extension/background/*.js extension/popup/*.js extension/shared/*.js tools/*.js tools/*.cjs tools/*.mjs; do node --check "$file"; done
          node -e "for (const f of ['extension/manifest.json','extension/_locales/en/messages.json','extension/_locales/zh_CN/messages.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Run offline regression tests
        run: npm test
      - name: Installer, native host launcher and uninstall smoke test
        timeout-minutes: 3
        run: npm run test:install
      - name: Install browser for regression tests
        if: runner.os == 'Linux'
        run: npx playwright-core install --with-deps chromium
      - name: Test editor, panel, English interface and Chinese-site integration
        if: runner.os == 'Linux'
        run: |
          npm run test:ui
          npm run test:ui:cn
